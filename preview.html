<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightz · Preview Fase 2</title>
<meta name="description" content="Preview navegable del avance de Fase 2 de Nightz by Zona Viva: app del público, panel del local y admin conectados en un solo flujo de compra (Modelo A). Datos de ejemplo.">
<meta name="theme-color" content="#0B0714">
<link rel="icon" href="nightz-icono.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mag:#FF2D87;--vio:#7C3AED;--ink:#0B0714;--panel:#140F21;--panel2:#1B1530;--line:#2A2140;
  --text:#EDE9F7;--mute:#9C93B5;--ok:#3DDC97;--warn:#F5B544;--danger:#FF5A5F;
  --r:14px;--disp:'Syne',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mag)}
a{color:var(--mag)}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(11,7,20,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--disp);letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--mag),var(--vio));display:grid;place-items:center;font:800 13px var(--disp);font-style:normal}
.ver{font:700 11px var(--mono);color:var(--ink);background:var(--warn);padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 13px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.top .sp{flex:1}
.tbtn{padding:8px 13px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap}
.tbtn.pri{background:var(--mag);border-color:var(--mag);color:#fff}
.tbtn:hover{border-color:var(--mute)}
.mswitch{display:none}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:400px minmax(0,1fr);gap:24px;padding:22px 20px 40px;max-width:1500px;margin:0 auto;align-items:start}
.phwrap{position:sticky;top:78px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.phone{width:380px;height:780px;max-height:calc(100vh - 110px);min-height:620px;border-radius:44px;background:#000;padding:11px;box-shadow:0 0 0 1px #2c2440,0 30px 80px rgba(124,58,237,.25);position:relative}
.screen{width:100%;height:100%;border-radius:34px;background:var(--ink);overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:700 13px var(--body)}
.sbar .notch{width:96px;height:26px;background:#000;border-radius:99px;position:absolute;left:50%;top:8px;transform:translateX(-50%)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel);padding:8px 6px 16px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);position:relative}
.tabs button.on{color:var(--mag)}
.tabs svg{width:22px;height:22px}
.dot{position:absolute;top:-2px;right:calc(50% - 16px);min-width:16px;height:16px;border-radius:99px;background:var(--mag);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.toast{position:absolute;left:12px;right:12px;top:44px;z-index:9;background:rgba(27,21,48,.97);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:drop .35s ease}
.toast i{flex:none;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--mag),var(--vio));display:grid;place-items:center;font:800 11px var(--disp);font-style:normal}
.toast b{display:block;font-size:13.5px}.toast span{font-size:12.5px;color:var(--mute)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}

/* app primitives */
.pad{padding:6px 18px 22px}
.h1{font:800 26px/1.1 var(--disp);letter-spacing:-.02em}
.h2{font:700 18px/1.2 var(--disp)}
.lbl{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;background:var(--mag);color:#fff;font-weight:800;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid rgba(255,90,95,.45);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);text-transform:capitalize}
.chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.evc{display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);margin-top:14px}
.cover{height:150px;position:relative;display:flex;align-items:flex-end;padding:12px}
.cover .tag{position:absolute;top:10px;left:10px;font:800 10px var(--body);letter-spacing:.1em;background:rgba(0,0,0,.5);padding:5px 8px;border-radius:99px}
.cover .tag.hot{background:var(--mag)}
.cover h3{font:800 24px/1 var(--disp);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.evc .meta{padding:11px 13px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.g1{background:radial-gradient(120% 90% at 0% 100%,#FF2D87 0,transparent 55%),radial-gradient(90% 90% at 100% 0,#7C3AED 0,transparent 60%),#1d0f33}
.g2{background:radial-gradient(120% 90% at 100% 100%,#00C2FF 0,transparent 50%),radial-gradient(90% 90% at 0 0,#7C3AED 0,transparent 60%),#0d1330}
.g3{background:radial-gradient(120% 90% at 0 0,#F5B544 0,transparent 50%),radial-gradient(90% 90% at 100% 100%,#FF2D87 0,transparent 60%),#2a0f1e}
.g4{background:radial-gradient(120% 90% at 100% 0,#3DDC97 0,transparent 45%),radial-gradient(90% 90% at 0 100%,#7C3AED 0,transparent 60%),#0d1f24}
.g5{background:radial-gradient(120% 100% at 50% 110%,#FF5A5F 0,transparent 55%),radial-gradient(80% 80% at 0 0,#F5B544 0,transparent 60%),#2a120e}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);font-size:18px;font-weight:700;display:grid;place-items:center}
.stepper button[disabled]{opacity:.3}
.stepper b{min-width:16px;text-align:center}
.tt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tt:first-child{border-top:0}
.sold{font:700 11px var(--body);color:var(--danger);letter-spacing:.06em}
.cartbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 30%);padding:22px 18px 14px}
.pm{display:flex;gap:8px;flex-wrap:wrap}
.pm button{padding:9px 12px;border-radius:11px;border:1px solid var(--line);font-size:13px;font-weight:700}
.pm button.on{border-color:var(--mag);background:rgba(255,45,135,.12)}
.copy{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.copy:first-child{border-top:0}
.copy b{font-size:16px}
.copy button{color:var(--mag);font-weight:800;font-size:13px}
.proof{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--mute);font-size:14px;padding:4px 0 10px}
.status{display:inline-flex;align-items:center;gap:6px;font:800 11px var(--body);letter-spacing:.06em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.st-ok{background:rgba(61,220,151,.14);color:var(--ok)}
.st-warn{background:rgba(245,181,68,.14);color:var(--warn)}
.st-bad{background:rgba(255,90,95,.14);color:var(--danger)}
.st-mute{background:rgba(156,147,181,.14);color:var(--mute)}
.st-mag{background:rgba(255,45,135,.14);color:var(--mag)}
.qrbox{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;display:block}
.used .qrbox{opacity:.25;filter:grayscale(1)}
.devn{font-size:11px;color:var(--mute);text-align:center;margin-top:22px;line-height:1.5}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.otp input{text-align:center;font:700 20px var(--mono);padding:11px 0}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}

/* ---------- web window ---------- */
.win{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:780px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.wbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#100b1b}
.wbar .dots{display:flex;gap:6px}.wbar .dots i{width:10px;height:10px;border-radius:50%;background:#3a3150}
.url{flex:1;max-width:520px;font:500 12.5px var(--mono);color:var(--mute);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{display:grid;grid-template-columns:220px minmax(0,1fr);flex:1}
.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:#110c1d}
.side .who{padding:6px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font:700 15px var(--disp)}
.side .who span{font-size:12px;color:var(--mute)}
.side button{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:9px 11px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.side button.on{background:var(--panel2);color:var(--text)}
.side button:hover{color:var(--text)}
.side .badge{background:var(--mag);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11px;color:var(--mute);padding:14px 10px 0;line-height:1.5}
.main{padding:24px 26px 34px;min-width:0}
.wh1{font:800 26px var(--disp);letter-spacing:-.02em}
.wsub{color:var(--mute);margin:2px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi p{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kpi b{display:block;font:800 25px var(--disp);margin-top:4px}
.kpi small{color:var(--mute);font-size:12px}
.kpi.hl{border-color:var(--mag);cursor:pointer}
.kpi.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,45,135,.7)}100%{box-shadow:0 0 0 14px rgba(255,45,135,0)}}
.box{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.box h3{font:700 16px var(--disp);margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl input{padding:6px 8px}
.twrap{overflow-x:auto}
.num{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pay{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.pay.new{border-color:var(--mag);animation:flash 1.2s ease}
.pay .thumb{border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.pay .acts{display:flex;flex-direction:column;gap:8px}
.wbtn{padding:9px 14px;border-radius:10px;background:var(--mag);color:#fff;font-weight:800;font-size:13.5px;white-space:nowrap}
.wbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.wbtn.okb{background:var(--ok);color:#06281a}
.wbtn.bad{background:transparent;border:1px solid rgba(255,90,95,.5);color:var(--danger)}
.wbtn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field span{font-size:12px;color:var(--mute);font-weight:600}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on{background:var(--ok)}.toggle.on::after{left:21px}
.scan{aspect-ratio:4/3;max-width:420px;border-radius:16px;background:linear-gradient(160deg,#1a1430,#0b0714);border:1px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden}
.scan .frame{width:56%;aspect-ratio:1;border:3px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .laser{position:absolute;left:22%;right:22%;height:2px;background:var(--mag);box-shadow:0 0 12px var(--mag);animation:las 2s ease-in-out infinite}
@keyframes las{0%,100%{top:22%}50%{top:76%}}
.result{border-radius:16px;padding:20px;text-align:center;margin-top:14px}
.result b{display:block;font:800 26px var(--disp)}
.r-ok{background:rgba(61,220,151,.15);border:1px solid var(--ok);color:var(--ok)}
.r-warn{background:rgba(245,181,68,.12);border:1px solid var(--warn);color:var(--warn)}
.r-bad{background:rgba(255,90,95,.12);border:1px solid var(--danger);color:var(--danger)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--vio));border-radius:99px}
.mod{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.mod:first-of-type{border-top:0}
.mod .ck{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.ck.y{background:var(--ok);color:#06281a}.ck.n{border:1.5px solid var(--mute);color:var(--mute)}
.mod small{display:block;color:var(--mute);font:500 11.5px var(--mono);margin-top:2px;word-break:break-all}
.note{font-size:13px;color:var(--mute);margin-top:10px}


/* ---------- Tablero · diseño C (Neón Marina) ---------- */
:root{--cy:#22D3EE}
.nm-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.nm-live{display:inline-flex;align-items:center;gap:9px;font:700 12px var(--mono);color:var(--cy);letter-spacing:.04em}
.nm-live i{width:9px;height:9px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.nm-card{background:#0E0A18;border:1px solid var(--line);border-radius:22px;padding:20px 22px;min-width:0}
.nm-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}
.nm-hero{flex:3 1 460px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.nm-hero svg{flex:0 1 230px;width:230px;max-width:100%;height:auto}
.nm-stats{flex:1 1 220px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.nm-stats b{display:block;font:800 28px var(--disp);margin-top:2px}
.nm-stats small{color:var(--mute);font-size:12.5px}
.nm-l{display:block;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.nm-side{flex:2 1 260px;display:flex;flex-wrap:wrap;gap:16px;min-width:0}
.nm-side>.nm-card{flex:1 1 240px}
.nm-pay{background:var(--mag);border-color:var(--mag);color:var(--ink);display:flex;flex-direction:column;gap:6px}
.nm-pay .nm-l{color:var(--ink)}
.nm-pay.calm{background:#0E0A18;border-color:var(--line);color:var(--text)}.nm-pay.calm .nm-l{color:var(--mute)}
.nm-big{font:800 46px/1 var(--disp)}
.nm-btn{align-self:flex-start;min-height:44px;margin-top:6px;padding:0 18px;border-radius:99px;background:var(--ink);color:var(--text);font-weight:800;font-size:14px}
.nm-h{font:800 19px var(--disp);margin:0 0 6px}
.nm-led{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;align-items:end}
.nm-led>div{display:flex;flex-direction:column;gap:7px;text-align:center}
.nm-led>div>span{font-size:13px;font-weight:700}
.nm-led small{font-size:12px;color:var(--mute)}
.nm-led .segs{display:flex;flex-direction:column-reverse;gap:4px}
.nm-led .segs i{display:block;height:9px;border-radius:3px;transition:background .4s}
.nm-row3{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.nm-row3>.nm-card{flex:1 1 260px}
.nm-li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.nm-inv{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nm-mix{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1.4fr) 44px;gap:10px;align-items:center;margin-top:10px;font-size:13.5px}
.nm-mix>div{height:18px;border-radius:5px;background:var(--line);overflow:hidden}.nm-mix i{display:block;height:100%}
.nm-mix b{text-align:right;font-size:12px}
@media (max-width:560px){.nm-led{gap:5px}.nm-led small{font-size:10px}.nm-led>div>span{font-size:11px}}

/* ---------- tour ---------- */
.tour{max-width:1460px;margin:14px auto 0;padding:0 20px}
.tour .tin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.tour .tt0{flex:none;display:flex;flex-direction:column;padding:0 6px}
.tour .tt0 b{font:700 14px var(--disp)}
.tour .tt0 span{font:700 11px var(--mono);color:var(--mute)}
.tour ol{list-style:none;display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.tour ol::-webkit-scrollbar{display:none}
.tour li button{display:flex;align-items:center;gap:8px;padding:7px 11px 7px 7px;border-radius:11px;border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;color:var(--mute)}
.tour li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 11px var(--mono);flex:none}
.tour li.done button{color:var(--mute)}
.tour li.done .n{background:var(--ok);border-color:var(--ok);color:#06281a}
.tour li.cur button{border-color:var(--mag);color:var(--text);background:rgba(255,45,135,.1)}
.tour li.cur .n{border-color:var(--mag);color:var(--mag)}

/* estadísticas en vivo del evento (event_live_stats) */
function stats(eid){
  const e=ev(eid); let sales=0,sold=0,tables=0,checked=0,pend=0;
  e.tickets.forEach(t=>{sales+=t.sold*t.price; sold+=t.sold;});
  e.tables.forEach(t=>{sales+=t.sold*t.deposit; tables+=t.sold;});
  checked = e.base.checked;
  S.orders.filter(o=>o.event===eid).forEach(o=>{
    if(o.status==='paid'){ sales+=o.subtotal; o.items.forEach(i=>{ if(i.kind==='ticket') sold+=i.qty; else tables+=i.qty; }); }
    if(o.status==='awaiting_verification') pend++;
  });
  checked += S.tickets.filter(t=>t.event===eid&&t.status==='used').length;
  return {sales,sold,tables,checked,pend};
}

/* ---------- QR (patrón visual determinístico a partir del token) ---------- */
function qrSVG(token){
  const N=29; let h=2166136261; for(const ch of token){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const rand=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296;};
  const m=[...Array(N)].map(()=>Array(N).fill(0));
  const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const y=r+i,x=c+j;if(y<0||x<0||y>=N||x>=N)continue;const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);m[y][x]=on?2:3;}};
  finder(0,0);finder(0,N-7);finder(N-7,0);
  for(let i=8;i<N-8;i++){m[6][i]=m[6][i]||(i%2?3:2);m[i][6]=m[i][6]||(i%2?3:2);}
  for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const y=N-9+i,x=N-9+j;m[y][x]=(Math.max(Math.abs(i),Math.abs(j))!==1)?2:3;}
  let p='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=m[y][x];if(v===0)v=rand()<.5?2:3;if(v===2)p+=`M${x} ${y}h1v1h-1z`;}
  return `<svg viewBox="-2 -2 ${N+4} ${N+4}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#fff"/><path d="${p}" fill="#0B0714"/></svg>`;
}

function myOrders(){ return S.orders.filter(o=>o.mine).sort((a,b)=>b.created-a.created); }
function pendingMine(){ return myOrders().filter(o=>o.status==='awaiting_verification'||(o.status==='pending'&&o.expires>Date.now())).length; }

function renderPhone(){
  const a=UI.app, el=$('#phone');
  const keep = el.querySelector('.scroll'); const top = keep && keep.dataset.k===a.screen+(a.id||'') ? keep.scrollTop : 0;
  let body='', tabs=true;
  if(!S.user.logged){ body=scrLogin(); tabs=false; }
  else if(a.screen==='explore') body=scrExplore();
  else if(a.screen==='event') { body=scrEvent(); tabs=false; }
  else if(a.screen==='checkout') { body=scrCheckout(); tabs=false; }
  else if(a.screen==='tickets') body=scrTickets();
  else if(a.screen==='ticket') { body=scrTicket(); tabs=false; }
  else if(a.screen==='profile') body=scrProfile();
  const t = a.screen==='ticket'||a.screen==='checkout'||a.screen==='event' ? '' : '';
  const tabsHtml = tabs ? `<nav class="tabs">${[['explore','Explorar',I.explore],['tickets','Mis entradas',I.ticket],['profile','Perfil',I.user]].map(([k,l,ic])=>`<button data-act="tab" data-v="${k}" class="${a.screen===k?'on':''}">${ic}${l}${k==='tickets'&&pendingMine()?`<span class="dot">${pendingMine()}</span>`:''}</button>`).join('')}</nav>`:'';
  el.innerHTML = `<div class="sbar"><span>9:41</span><div class="notch"></div><span>5G ▮▮▮</span></div>${UI.toast?`<div class="toast" data-act="toastgo"><i>NZ</i><div><b>${esc(UI.toast.t)}</b><span>${esc(UI.toast.b)}</span></div></div>`:''}<div class="scroll" data-k="${a.screen+(a.id||'')}">${body}</div>${tabsHtml}`;
  const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=top;
}

    <div class="meta"><div><b>${esc(v.name)}</b><div class="mute">${esc(e.date)} · ${esc(e.time)}</div></div><div style="text-align:right"><b>desde ${usd(Math.min(...e.tickets.map(t=>t.price)))}</b><div class="mute">${left?left+' disponibles':'<span class="sold">AGOTADO</span>'}</div></div></div></button>`;
}

function cartTotal(e){
  let sub=0,n=0; for(const [k,q] of Object.entries(UI.cart)){ if(!q) continue; const t=e.tickets.find(x=>x.id===k); if(t){sub+=t.price*q;n+=q;} const m=e.tables.find(x=>x.id===k); if(m){sub+=m.deposit*q;n+=q;} }
  return {sub,n};
}

    return `<div class="tt"><div><b>${esc(t.name)}</b><div class="mute" style="font-size:13px">${kind==='ticket'?(esc(t.desc)||'Entrada'):`${t.people} personas · consumo mínimo ${usd(t.min)}`}</div>
      <div style="font-size:13px;margin-top:2px">${kind==='ticket'?`<b>${usd(t.price)}</b>`:`Depósito <b>${usd(t.deposit)}</b>`} ${av?`<span class="mute">· quedan ${av}</span>`:'<span class="sold">· AGOTADO</span>'}</div></div>
      <div class="stepper"><button data-act="qty" data-v="${t.id}" data-d="-1" ${q?'':'disabled'} aria-label="Quitar">−</button><b>${q}</b><button data-act="qty" data-v="${t.id}" data-d="1" data-max="${max}" ${q<max?'':'disabled'} aria-label="Agregar">+</button></div></div>`;};

    <div class="pad" style="padding-top:16px">

function scrCheckout(){
  const o=S.orders.find(x=>x.id===UI.app.id); if(!o) return '<div class="empty">Orden no encontrada</div>';
  const e=ev(o.event), v=venue(e.venue);
  const left=Math.max(0,o.expires-Date.now()), mm=Math.floor(left/60000), ss=String(Math.floor(left%60000/1000)).padStart(2,'0');
  const pending=o.status==='pending'&&left>0;
  const d=(v.methods[o.method]||{}).details||{};
  let html=`<div class="pad"><button class="back" data-act="tab" data-v="tickets">${I.back} Mis entradas</button>
    <div class="lbl">Orden <span class="mono">${o.code}</span> · ${esc(e.title)}</div>
    <div class="h1" style="margin-top:6px;font-size:32px">${o.total_bs?bs(o.total_bs):usd(o.total)}</div>
    ${o.total_bs?`<p class="mute">${usd(o.total)} a tasa BCV ${bsF.format(o.rate)} Bs/USD</p>`:''}`;
  if(pending){
    html+=`<div class="card" style="margin-top:16px;border-color:var(--mag)">Tienes <b id="cd" style="color:var(--mag)">${mm}:${ss}</b> para pagar. Tus entradas quedan apartadas mientras tanto.</div>
      <div class="lbl" style="margin:18px 0 6px">Págale a ${esc(v.name)} por ${PM_LABEL[o.method]}</div>
      <div class="card">${PM_FIELDS[o.method].filter(([k])=>d[k]).map(([k,l])=>`<div class="copy"><div><div class="lbl">${l}</div><b>${esc(d[k])}</b></div><button data-act="copy" data-v="${esc(d[k])}">Copiar</button></div>`).join('')}
        <p class="mute" style="font-size:12.5px;margin-top:8px">El pago va directo a la cuenta del local. Nightz no recibe tu dinero.</p></div>
      <div class="lbl" style="margin:18px 0 6px">Cuando pagues</div>
      <input id="ref" inputmode="numeric" placeholder="Número de referencia · Ej. 00123456" value="${esc(o.ref||'')}">
      <button class="btn ghost" style="margin-top:10px" data-act="proof">${o.proof?'Cambiar comprobante':'Adjuntar captura del comprobante'}</button>
      ${o.proof?`<div class="proof">${proofSVG(o)}</div>`:''}
      <p id="ck-err" style="color:var(--danger);font-size:13px;margin-top:6px"></p>
      <button class="btn" style="margin-top:8px" data-act="paid">Ya pagué</button>
      <button class="btn danger" style="margin-top:10px" data-act="cancel">Cancelar compra</button>`;
  } else {
    const expired=o.status==='cancelled'&&o.expired;
    const msg = expired?'Se acabó el tiempo para pagar y las entradas se liberaron. Puedes intentar de nuevo desde el evento.'
      : o.status==='awaiting_verification'?`${v.name} está verificando tu pago. Te avisamos y tu QR aparece en «Mis entradas» apenas lo confirme.`
      : o.status==='paid'?'Pago confirmado. Tus entradas están en «Mis entradas».'
      : o.rejected?`${v.name} no pudo verificar el pago (${o.rejected}). Las entradas se liberaron.`:'Esta orden ya no está activa.';
    html+=`<div class="card" style="margin-top:18px"><span class="status ${o.status==='paid'?'st-ok':o.status==='awaiting_verification'?'st-warn':'st-bad'}">${expired?'Tiempo vencido':ORDER_LABEL[o.status]}</span><p style="margin-top:10px">${esc(msg)}</p>
      <button class="btn" style="margin-top:14px" data-act="tab" data-v="tickets">Ir a Mis entradas</button></div>`;
  }
  return html+`<p class="devn">${DEV_NOTICE}</p></div>`;
}

    const e=ev(o.event), v=venue(e.venue), tk=S.tickets.filter(t=>t.order===o.id);

function venueOrders(vid){ return S.orders.filter(o=>ev(o.event).venue===vid); }
function pendingPays(vid){ return venueOrders(vid).filter(o=>o.status==='awaiting_verification').sort((a,b)=>b.created-a.created); }

/* ---------- Panel: Tablero (diseño C · Neón Marina) ---------- */
const DAYS=['19 oct','20','21','22','23','24','25','Hoy'];
const DAYW=[.234,.079,.061,.097,.155,.12,.109,.145];
function salesByDay(e){
  const base=e.tickets.reduce((a,t)=>a+t.sold,0);
  const arr=DAYW.map(w=>Math.round(base*w)); const diff=base-arr.reduce((a,x)=>a+x,0); arr[7]+=diff;
  S.orders.filter(o=>o.event===e.id&&o.status==='paid').forEach(o=>o.items.forEach(i=>{ if(i.kind==='ticket') arr[7]+=i.qty; }));
  return arr;
}
function payMix(eid){
  const e=ev(eid); let base=0; e.tickets.forEach(t=>base+=t.sold*t.price); e.tables.forEach(t=>base+=t.sold*t.deposit);
  const m={pago_movil:base*.46,zelle:base*.31,efectivo:base*.15,transferencia:base*.08,tarjeta:0};
  S.orders.filter(o=>o.event===eid&&o.status==='paid').forEach(o=>{m[o.method]=(m[o.method]||0)+o.subtotal;});
  const tot=Object.values(m).reduce((a,x)=>a+x,0)||1;
  return Object.entries(m).filter(([k,v])=>v>0).map(([k,v])=>[k,Math.round(v/tot*100)]).sort((a,b)=>b[1]-a[1]);
}

  const pct=cap?Math.round(s.sold/cap*100):0, inPct=s.sold?Math.round(s.checked/s.sold*100):0;
  const C=2*Math.PI*120, dash=(C*pct/100).toFixed(1);

  let com=0; e.tickets.forEach(t=>com+=t.sold*t.price*S.settings.ticket_commission_pct/100); e.tables.forEach(t=>com+=t.sold*t.deposit*S.settings.table_commission_pct/100);
  S.orders.filter(o=>o.event===eid&&o.status==='paid').forEach(o=>com+=o.commission);
  const days=salesByDay(e), mx=Math.max(...days,1), unit=Math.max(1,Math.ceil(mx/13/5)*5), peak=days.indexOf(Math.max(...days));
  const mix=payMix(eid), MC={pago_movil:'var(--cy)',zelle:'var(--mag)',efectivo:'#A78BFA',transferencia:'var(--warn)',tarjeta:'var(--mute)'};
  const door=S.checkins.filter(c=>c.event===eid).slice(-5).reverse();
  const R={ok:['var(--cy)','Adelante'],already_used:['var(--warn)','Ya ingresó'],void:['var(--danger)','Anulada'],not_found:['var(--danger)','No existe']};
  return `<div class="nm-head"><div><div class="wh1" style="font-size:34px">${esc(e.title)} <span class="mute" style="font:600 18px var(--disp)">· tablero</span></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><select data-act="pevent" style="max-width:320px">${evs.map(x=>`<option value="${x.id}" ${x.id===eid?'selected':''}>${esc(x.title)} · ${esc(x.date)}</option>`).join('')}</select>

  <div class="nm-row">
    <section class="nm-card nm-hero">
      <svg viewBox="0 0 280 280" role="img" aria-label="${s.sold} entradas vendidas de ${cap}, ${pct} por ciento"><circle cx="140" cy="140" r="120" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="140" cy="140" r="120" fill="none" stroke="var(--mag)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${dash} ${C.toFixed(1)}" transform="rotate(-90 140 140)" style="transition:stroke-dasharray .6s ease"/><circle cx="140" cy="140" r="96" fill="none" stroke="var(--cy)" stroke-width="2" stroke-dasharray="4 8" opacity=".6"/><text x="140" y="146" text-anchor="middle" fill="var(--text)" font-family="Syne,sans-serif" font-size="74" font-weight="800">${s.sold}</text><text x="140" y="180" text-anchor="middle" fill="var(--mute)" font-family="JetBrains Mono,monospace" font-size="13">VENDIDAS · ${pct} %</text></svg>

        <div><span class="nm-l">Ingresaron</span><b style="color:var(--cy)">${s.checked}</b><small>${inPct} % de las vendidas</small></div>
        <div><span class="nm-l">Ventas</span><b>${usd(s.sales)}</b><small>${bs(round2(s.sales*S.rate))}</small></div>
        <div><span class="nm-l">Mesas</span><b>${s.tables}/${tcap}</b><small>reservadas</small></div>
      </div>
    </section>
    <div class="nm-side">
      <section class="nm-card nm-pay ${pend.length?'':'calm'}">
        <span class="nm-l">Pagos por verificar</span><b class="nm-big">${pend.length}</b>
        <span style="font-size:13.5px;font-weight:600">${pend.length?pend.slice(0,2).map(o=>`${esc(o.buyer)} · ${o.total_bs?bs(o.total_bs):usd(o.total)} · ${PM_LABEL[o.method]}`).join('<br>'):'Todo al día. Los pagos reportados aparecen aquí al instante.'}</span>

      </section>
      <section class="nm-card"><span class="nm-l">Comisión Zona Viva</span><b style="display:block;font:800 30px var(--disp);color:var(--cy);margin:2px 0">${usd(round2(com))}</b><small class="mute">${S.settings.ticket_commission_pct} % entradas · ${S.settings.table_commission_pct} % mesas · se liquida el lunes</small></section>
    </div>
  </div>
  <section class="nm-card">
    <div class="row between" style="flex-wrap:wrap;margin-bottom:14px"><h3 class="nm-h">Entradas vendidas por día</h3><span class="mono mute" style="font-size:11.5px">CADA BLOQUE = ${unit} ENTRADAS</span></div>
    <div class="nm-led" role="img" aria-label="Entradas vendidas por día: ${days.map((v,i)=>DAYS[i]+' '+v).join(', ')}">${days.map((v,i)=>{const on=Math.round(v/unit);return `<div><span class="mono" style="color:${i===peak?'var(--mag)':'var(--text)'}">${v}</span><div class="segs">${Array.from({length:13},(_,k)=>`<i style="background:${k<on?(i===peak?'var(--mag)':'var(--cy)'):'#1C1730'}"></i>`).join('')}</div><small>${DAYS[i]}</small></div>`;}).join('')}</div>

    <section class="nm-card"><h3 class="nm-h">Cómo pagaron</h3>${mix.length?mix.map(([k,p])=>`<div class="nm-mix"><span>${PM_LABEL[k]}</span><div><i style="width:${p}%;background:${MC[k]}"></i></div><b class="mono">${p} %</b></div>`).join(''):'<p class="mute" style="font-size:13px">Sin ventas todavía.</p>'}<small class="mute" style="display:block;margin-top:8px">Tasa BCV del día: ${bsF.format(S.rate)} Bs/USD</small></section>
  </div>`;

function activity(eid){
  const items=[];
  S.orders.filter(o=>o.event===eid).forEach(o=>{ items.push({t:o.paid_at||o.created,h:`<b>${esc(o.buyer)}</b> · ${o.status==='paid'?'pago confirmado':o.status==='awaiting_verification'?'reportó pago':ORDER_LABEL[o.status].toLowerCase()} · ${o.total_bs?bs(o.total_bs):usd(o.total)}`}); });
  S.checkins.filter(c=>c.event===eid).forEach(c=>items.push({t:c.at,h:`Check-in <span class="mono">${c.code}</span> · ${c.res==='ok'?'<span style="color:var(--ok)">ingresó</span>':`<span style="color:var(--warn)">${c.res==='already_used'?'ya usado':c.res==='void'?'anulada':'no existe'}</span>`}`}));
  items.sort((a,b)=>b.t-a.t);
  return items.length?items.slice(0,7).map(i=>`<div class="row between" style="font-size:13px;padding:7px 0;border-top:1px solid var(--line)"><span>${i.h}</span><span class="mute mono" style="font-size:11.5px;white-space:nowrap">${hhmm(i.t)}</span></div>`).join(''):'<p class="mute" style="font-size:13px">Sin movimientos todavía.</p>';
}

function weekCalc(vid){
  // semana actual (26 oct – 1 nov): ventas base de eventos de esta semana + órdenes confirmadas en la demo
  let gross=0,com=0;
  S.events.filter(e=>e.venue===vid).forEach(e=>{
    e.tickets.forEach(t=>{gross+=t.sold*t.price;com+=t.sold*t.price*S.settings.ticket_commission_pct/100;});
    e.tables.forEach(t=>{gross+=t.sold*t.deposit;com+=t.sold*t.deposit*S.settings.table_commission_pct/100;});
  });
  S.orders.filter(o=>o.status==='paid'&&ev(o.event).venue===vid).forEach(o=>{gross+=o.subtotal;com+=o.commission;});
  return {gross:round2(gross),com:round2(com),net:round2(gross-com)};
}

  o.status='paid'; o.paid_at=Date.now(); const e=ev(o.event);
  o.items.forEach(it=>{ const t=(it.kind==='ticket'?e.tickets:e.tables).find(x=>x.id===it.id);
    for(let i=0;i<it.qty;i++) S.tickets.push({id:uid('k'),order:o.id,event:o.event,name:it.kind==='ticket'?t.name:t.name+' · '+t.people+' personas',qr:rnd(24),code:'T-'+rnd(4)+'-'+rnd(4),status:'valid',checked:null}); });
  save();
  if(o.mine) pushToast('Pago confirmado ✓',`${venue(e.venue).name} verificó tu pago. Tus QR para ${e.title} ya están en «Mis entradas».`,{screen:'tickets'});
}
/* checkin_ticket */
function checkin(eid,code){
  code=(code||'').trim().toUpperCase(); const t=S.tickets.find(x=>x.code===code&&x.event===eid); let r;
  if(!t) r={res:'not_found',code};
  else if(t.status==='used') r={res:'already_used',code,name:t.name,at:t.checked};
  else if(t.status==='void') r={res:'void',code,name:t.name};
  else { t.status='used'; t.checked=Date.now(); r={res:'ok',code,name:t.name}; }
  S.checkins.push({event:eid,code,res:r.res,at:Date.now()}); UI.panel.checkin=r; save();
}

document.addEventListener('click',ev0=>{
  const b=ev0.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(b.tagName==='SELECT') return;
  switch(a){
    case 'm': setM(v); return;
    case 'web': goWeb(v); break;
    case 'tour': UI.tour=!UI.tour; UI.tourMin=false; break;
    case 'tourmin': UI.tourMin=!UI.tourMin; break;
    case 'dlgno': $('#modal').innerHTML=''; dlgCb=null; return;
    case 'dlgok': { const cb=dlgCb, i=$('#dlg-in'), val=i?i.value:null; $('#modal').innerHTML=''; dlgCb=null; if(cb) cb(val); render(); return; }
    case 'reset': dialog({title:'Reiniciar la demo',text:'Vuelve a los datos de ejemplo iniciales y borra lo que hiciste en esta demo.',yes:'Reiniciar',danger:true,ok:()=>doReset()}); return;

    case 'step': runStep(+v); break;
    /* app */
    case 'sendcode': { const em=$('#l-email').value.trim(); if(!/^\S+@\S+\.\S+$/.test(em)){ $('#l-email').style.borderColor='var(--danger)'; return; } S.user.email=em; UI.app.loginStep='code'; break; }
    case 'loginback': UI.app.loginStep='email'; break;
    case 'fillotp': document.querySelectorAll('[data-otp]').forEach((i,k)=>i.value='482913'[k]); return;
    case 'verify': { const c=[...document.querySelectorAll('[data-otp]')].map(i=>i.value).join(''); if(c!=='482913'){ $('#otp-err').textContent='Código incorrecto. En el preview usa 482913.'; return; } S.user.logged=true; save(); UI.app.screen='explore'; break; }
    case 'tab': goApp(v); break;
    case 'toastgo': if(UI.toast&&UI.toast.go) goApp(UI.toast.go.screen); UI.toast=null; break;
    case 'city': UI.app.city=v; break;
    case 'genre': UI.app.genre=v||null; break;
    case 'open': UI.cart={}; UI.method=null; goApp('event',v); break;
    case 'qty': { const d=+b.dataset.d, cur=UI.cart[v]||0, max=+(b.dataset.max||99); UI.cart[v]=Math.max(0,Math.min(max,cur+d)); break; }
    case 'method': UI.method=v; break;
    case 'order': createOrder(); break;
    case 'checkout': goApp('checkout',v); break;
    case 'copy': { try{navigator.clipboard&&navigator.clipboard.writeText(v).catch(()=>{});}catch(e){} b.textContent='Copiado ✓'; setTimeout(()=>{b.textContent='Copiar';},1400); return; }
    case 'proof': { const o=S.orders.find(x=>x.id===UI.app.id); const r=$('#ref'); o.ref=r.value.trim()||o.ref||String(Math.floor(10000000+Math.random()*89999999)).padStart(8,'0'); o.proof=true; save(); break; }
    case 'paid': { const o=S.orders.find(x=>x.id===UI.app.id); const r=$('#ref').value.trim(); if(r) o.ref=r;
      if(!o.ref&&!o.proof){ $('#ck-err').textContent='Escribe el número de referencia o adjunta el comprobante.'; return; }
      if(o.expires<=Date.now()){ expireOrders(); break; }
      o.status='awaiting_verification'; o.reported=Date.now(); UI.newPay[o.id]=true; UI.panel.venue=ev(o.event).venue; if(UI.web==='panel'&&UI.panel.page==='eventos') UI.panel.eventEdit=null; save(); break; }
    case 'cancel': { const o=S.orders.find(x=>x.id===UI.app.id); dialog({title:'Cancelar compra',text:'Se liberan las entradas apartadas. ¿Seguro?',yes:'Sí, cancelar',no:'No',danger:true,ok:()=>{ o.status='cancelled'; save(); goApp('tickets'); }}); return; }
    case 'ticket': goApp('ticket',v); break;
    case 'ucity': S.user.city=v; UI.app.city=v; save(); break;
    case 'interest': { const i=S.user.interests; const k=i.indexOf(v); k>=0?i.splice(k,1):i.push(v); save(); break; }
    case 'upush': S.user.push=!S.user.push; save(); break;
    case 'logout': S.user.logged=false; UI.app.loginStep='email'; save(); break;
    /* panel */
    case 'pp': goWeb('panel',v); if(v!=='eventos') UI.panel.eventEdit=null; if(v==='checkin') UI.panel.checkin=null; break;
    case 'confirm': confirmPay(v); delete UI.newPay[v]; break;
    case 'reject': { const o=S.orders.find(x=>x.id===v); dialog({title:'Rechazar pago',text:'Escribe el motivo. Lo ve el comprador y las entradas se liberan.',input:'La referencia no aparece en la cuenta',yes:'Rechazar pago',danger:true,ok:why=>{ o.status='cancelled'; o.rejected=(why||'').trim()||'pago no encontrado'; save(); if(o.mine) pushToast('Pago no verificado',`${venue(ev(o.event).venue).name}: ${o.rejected}.`,{screen:'tickets'}); }}); return; }
    case 'zoom': { const o=S.orders.find(x=>x.id===v); $('#modal').innerHTML=`<div class="modal" data-act="unzoom"><div class="in">${proofSVG(o)}<p class="mute" style="font-size:12.5px;margin-top:8px;text-align:center">Comprobante adjunto por ${esc(o.buyer)} · toca para cerrar</p></div></div>`; return; }
    case 'unzoom': $('#modal').innerHTML=''; return;
    case 'newevent': { const e={id:uid('e'),venue:PV(),title:'NUEVO EVENTO',g:['g1','g2','g3','g4','g5'][S.seq%5],genres:['house'],lineup:['Por anunciar'],date:'Sáb 14 nov',time:'10:00 p. m.',doors:'9:30 p. m.',min_age:18,dress:'Casual',status:'draft',featured:false,desc:'Descripción del evento.',tickets:[{id:uid('t'),name:'General',desc:'Acceso general',price:15,qty:200,sold:0,max:6}],tables:[],base:{checked:0}}; S.events.push(e); save(); UI.panel.eventEdit=e.id; break; }
    case 'editevent': UI.panel.eventEdit=v||null; break;
    case 'publish': { const e=ev(v); e.status=e.status==='published'?'draft':'published'; save(); break; }
    case 'egenre': { const e=ev(UI.panel.eventEdit), g=e.genres, k=g.indexOf(v); k>=0?(g.length>1&&g.splice(k,1)):g.push(v); save(); break; }
    case 'addtt': { const e=ev(UI.panel.eventEdit); e.tickets.push({id:uid('t'),name:'Nueva entrada',desc:'',price:10,qty:100,sold:0,max:6}); save(); break; }
    case 'addmt': { const e=ev(UI.panel.eventEdit); e.tables.push({id:uid('m'),name:'Mesa',people:6,min:200,deposit:80,qty:5,sold:0}); save(); break; }
    case 'scan': { const ts=S.tickets.filter(x=>x.event===v); let t=UI.app.screen==='ticket'?ts.find(x=>x.id===UI.app.id):null; if(!t) t=ts.find(x=>x.status==='valid')||ts[0]; if(t){ checkin(v,t.code); if(window.innerWidth>980) goApp('ticket',t.id); } break; }
    case 'checkcode': checkin(v,$('#ci-code').value); break;
    case 'pmtoggle': { const pm=venue(PV()).methods[v]; pm.active=!pm.active; save(); break; }
    /* admin */
    case 'ap': goWeb('admin',v); break;
    case 'vapprove': venue(v).status='approved'; venue(v).docs=''; save(); break;
    case 'vreject': venue(v).status='rejected'; save(); break;
    case 'setrate': { const r=parseFloat($('#rate').value); if(!(r>0)) return; S.rate=round2(r); S.rateHist.unshift({d:'26 oct 2026 · '+hhmm(Date.now()),r:S.rate,by:'admin@zonaviva'}); save(); break; }
    case 'pgenre': { const g=UI.push.genres,k=g.indexOf(v); k>=0?g.splice(k,1):g.push(v); break; }
    case 'sendpush': { const p=UI.push, seg={city:p.city,genres:p.genres.slice(),days:+p.days}; const n=audience(seg);
      S.campaigns.push({id:uid('c'),title:p.title,body:p.body,seg,status:'sent',sent:n,at:'Hoy · '+hhmm(Date.now())}); S.flags.pushSent=true; save();
      const me=(!seg.city||seg.city===S.user.city)&&(!seg.genres.length||seg.genres.some(g=>S.user.interests.includes(g)))&&S.user.push&&S.user.logged;
      if(me) pushToast(p.title,p.body,{screen:'explore'}); break; }
    case 'markpaid': S.payoutsPaid[v]=true; save(); break;
  }
  render();
});

/* inputs que no deben re-renderizar mientras se escribe */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.otp!==undefined){ t.value=t.value.replace(/\D/g,'').slice(0,1); if(t.value){ const n=document.querySelector(`[data-otp="${+t.dataset.otp+1}"]`); n&&n.focus(); } return; }
  if(t.dataset.ef){ const e2=ev(UI.panel.eventEdit), k=t.dataset.ef; e2[k]= k==='lineup'?t.value.split(',').map(x=>x.trim()).filter(Boolean): k==='min_age'?(+t.value||18) : t.value; save(); renderPhone(); return; }
  if(t.dataset.tt!==undefined||t.dataset.mt!==undefined){ const e2=ev(UI.panel.eventEdit), arr=t.dataset.tt!==undefined?e2.tickets:e2.tables, row=arr[+(t.dataset.tt??t.dataset.mt)], k=t.dataset.k; row[k]= k==='name'?t.value:Math.max(0,+t.value||0); save(); renderPhone(); return; }
  if(t.dataset.pm){ const pm=venue(PV()).methods[t.dataset.pm]; pm.details[t.dataset.k]=t.value; save(); renderPhone(); return; }
  if(t.dataset.set){ S.settings[t.dataset.set]=Math.max(0,+t.value||0); save(); return; }
  if(t.dataset.push){ UI.push[t.dataset.push]=t.value; if(t.tagName!=='SELECT') return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='pvenue'){ UI.panel.venue=t.value; UI.panel.event=null; UI.panel.eventEdit=null; UI.panel.checkin=null; render(); return; }
  if(t.dataset.act==='pevent'){ UI.panel.event=t.value; UI.panel.checkin=null; render(); }
  if(t.dataset.push){ UI.push[t.dataset.push]=t.value; renderWeb(); }
  if(t.dataset.set||t.dataset.tt!==undefined||t.dataset.mt!==undefined) renderWeb();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ci-code'){ const b=document.querySelector('[data-act="checkcode"]'); b&&b.click(); }
  if(e.key==='Enter'&&e.target.id==='l-email'){ const b=document.querySelector('[data-act="sendcode"]'); b&&b.click(); }
  if(e.key==='Escape') $('#modal').innerHTML='';
});

/* ---------- recorrido guiado ---------- */
const STEPS=[
  ['Entra a la app','Correo + código de 6 dígitos, sin contraseña.',()=>S.user.logged,()=>{goApp('explore');}],
  ['Elige un evento y aparta entradas','Ej. NOCHE BLANCA en Ola Rooftop · Pago Móvil.',()=>S.orders.some(o=>o.mine),()=>{ if(S.user.logged){UI.cart={};UI.method=null;goApp('event','e1');} }],
  ['Paga al local y reporta la referencia','Adjunta el comprobante y toca «Ya pagué».',()=>S.orders.some(o=>o.mine&&(o.status==='awaiting_verification'||o.status==='paid')),()=>{const o=myOrders().find(x=>x.status==='pending'); if(o) goApp('checkout',o.id);}],
  ['El local verifica el pago','Panel › Pagos por verificar › Confirmar.',()=>S.orders.some(o=>o.mine&&o.status==='paid'),()=>{const o=myOrders().find(x=>x.status==='awaiting_verification'); if(o) UI.panel.venue=ev(o.event).venue; goWeb('panel','pagos');}],
  ['Abre tu QR en «Mis entradas»','Llega al instante, sin recargar.',()=>!!S.flags.viewedTicket,()=>{goApp('tickets');}],
  ['Check-in en la puerta','Panel › Check-in › Escanear (y otra vez: doble uso).',()=>S.tickets.some(t=>t.status==='used'),()=>{const t=S.tickets.find(x=>x.status==='valid'); if(t){ UI.panel.venue=ev(t.event).venue; UI.panel.event=t.event; if(window.innerWidth>980) goApp('ticket',t.id); } UI.panel.checkin=null; goWeb('panel','checkin');}],
  ['Revisa la liquidación','La comisión de Zona Viva se calcula sola.',()=>!!S.flags.viewedPayout,()=>{goWeb('panel','liq');}],
  ['Envía un push segmentado','Admin › Campañas push › Enviar ahora.',()=>!!S.flags.pushSent,()=>{goWeb('admin','push');}]
];
function runStep(i){ STEPS[i][3](); }
function renderTour(){
  const el=$('#tour'); if(!UI.tour){ el.style.display='none'; return; } el.style.display='';
  const done=STEPS.map(s=>{try{return !!s[2]();}catch(e){return false;}}); const cur=done.indexOf(false);
  const sc=el.querySelector('ol'); const left=sc?sc.scrollLeft:0;
  el.innerHTML=`<div class="tin"><div class="tt0"><b>Recorrido</b><span>${done.filter(Boolean).length}/${STEPS.length} pasos</span></div>
   <ol>${STEPS.map((s,i)=>`<li class="${done[i]?'done':''} ${i===cur?'cur':''}"><button data-act="step" data-v="${i}" title="${esc(s[1])}"><span class="n">${done[i]?'✓':i+1}</span>${s[0]}</button></li>`).join('')}</ol>
   <button class="x" data-act="tour" aria-label="Ocultar recorrido">Ocultar</button></div>
   <div class="hint">${cur<0?'<b>¡Listo!</b> Recorriste el flujo completo de Fase 2. Usa «Reiniciar» para empezar de nuevo.':`<b>Paso ${cur+1}:</b> ${esc(STEPS[cur][1])} <span>· toca el paso para ir directo a esa pantalla.</span>`}</div>`;
  const ol=el.querySelector('ol'); if(ol){ ol.scrollLeft=left; const c=ol.querySelector('.cur'); if(c&&UI.tourScroll!==cur){ UI.tourScroll=cur; ol.scrollLeft=Math.max(0,c.offsetLeft-ol.offsetLeft-40); } }
}

/* ---------- reloj: cuenta regresiva y vencimientos ---------- */
setInterval(()=>{
  if(expireOrders()) render();
  const cd=$('#cd'); if(cd&&UI.app.screen==='checkout'){ const o=S.orders.find(x=>x.id===UI.app.id); if(o){ const left=Math.max(0,o.expires-Date.now()); cd.textContent=Math.floor(left/60000)+':'+String(Math.floor(left%60000/1000)).padStart(2,'0'); if(!left) render(); } }
},1000);

/* sincroniza entre pestañas (misma demo abierta en dos ventanas) */
window.addEventListener('storage',e=>{ if(e.key===STORE_KEY&&e.newValue){ try{S=JSON.parse(e.newValue); render();}catch(_){} } });

expireOrders();
setM('app');
render();

</script>
